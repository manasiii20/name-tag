<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hello, i'm</title>
<meta name="description" content="Make a name tag, swing it around, save it as a PNG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,700..900&family=Courier+Prime&family=Comic+Neue:wght@700&family=Lobster&family=Pacifico&family=Fredericka+the+Great&family=Rubik+Wet+Paint&family=Archivo+Narrow:wght@600;700&family=Gaegu:wght@400;700&family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <section class="stage" id="stage" aria-label="Your name tag">
    <h1 class="site">hello, i'm<span class="cursor" aria-hidden="true">_</span></h1>


    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <div class="mount" id="mount">
      <div class="drop" id="drop">
        <div class="rig" id="rig">
          <div class="strap" id="strap"><span id="strapText"></span></div>
          <div class="clip" aria-hidden="true"><span class="clip-body"></span><span class="clip-stem"></span><span class="clip-ring"></span></div>
          <div class="card" id="card" tabindex="0" role="button">
            <div class="flip">
              <div class="face front" id="front"></div>
              <div class="face back" id="back"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </section>

  <div class="actions">
    <div class="stack">
      <button type="button" class="act" id="flipBtn" aria-pressed="false">
        <span class="act-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6M18 3v4h-4M6 21v-4h4"/></svg></span>
        <span class="act-t">Flip it</span>
        <span class="act-s" id="flipState">Showing the front</span>
      </button>
      <button type="button" class="act primary" id="saveBtn">
        <span class="act-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>
        <span class="act-t">Save PNG</span>
        <span class="act-s">Transparent background</span>
      </button>
    </div>
  </div>

  <button type="button" class="edit-toggle" id="editToggle" aria-controls="panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></svg>Edit tag
  </button>

  <aside class="panel" id="panel" aria-label="Edit your tag">
    <div class="panel-top"><span>Edit your tag</span><button type="button" class="panel-close" id="panelClose" aria-label="Close the editor">Done</button></div>
    <section class="pick" aria-labelledby="h-pick">
      <h2 class="pick-h" id="h-pick">Which tag are you?</h2>
      <div class="seg-track" id="styles" role="group" aria-labelledby="h-pick">
        <button type="button" class="sty seg" data-tpl="classic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 10h18M8 14.5h6"/></svg>Classic</button>
        <button type="button" class="sty seg" data-tpl="volunteer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2.5h4V6h-4z"/><rect x="5.5" y="6" width="13" height="15.5" rx="2.5"/><path d="M9 14h6M10 17.5h4"/></svg>Say Hi</button>
        <button type="button" class="sty seg" data-tpl="glow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>Mood Light</button>
        <button type="button" class="sty seg" data-tpl="postcard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M14 9h4v4h-4zM6 10h5M6 14h5"/></svg>Postcard</button>
        <button type="button" class="sty seg" data-tpl="coffee"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c0 1 1 1 1 2s-1 1-1 2M12 3.5c0 1 1 1 1 2s-1 1-1 2"/></svg>Coffee Run</button>
        <button type="button" class="sty seg" data-tpl="slogan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H11l-4.5 3.5V16H4z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg>Motto</button>
        <button type="button" class="sty seg" data-tpl="crayon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5l5 5L9 20H4v-5z"/><path d="M13 6l5 5M4 15l5 5"/></svg>Crayon</button>
        <button type="button" class="sty seg" data-tpl="licence"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M14 10h4.5M14 13.5h3"/></svg>Licensed</button>
      </div>
    </section>

    <div class="tickets" id="tickets">
      <div class="ticket is-open" data-ticket="name">
        <button type="button" class="t-head" id="th-name" aria-expanded="true" aria-controls="tb-name">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">What do we call you?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-name" role="region" aria-labelledby="th-name">
          <div class="t-inner">
            <label class="sr-only" for="f-name">Name</label>
            <input id="f-name" class="t-input" data-key="name" autocomplete="off" maxlength="24" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="(visitor)">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="pronouns">
        <button type="button" class="t-head" id="th-pronouns" aria-expanded="false" aria-controls="tb-pronouns">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">How should people refer to you?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-pronouns" role="region" aria-labelledby="th-pronouns">
          <div class="t-inner">
            <label class="sr-only" for="f-pronouns">Pronouns</label>
            <input id="f-pronouns" class="t-input" data-key="pronouns" autocomplete="off" maxlength="16" placeholder="she/her, they/them…">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="role" data-for="role">
        <button type="button" class="t-head" id="th-role" aria-expanded="false" aria-controls="tb-role">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">What are you here as?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-role" role="region" aria-labelledby="th-role">
          <div class="t-inner">
            <label class="sr-only" for="f-role">Role</label>
            <input id="f-role" class="t-input" data-key="role" autocomplete="off" maxlength="32" placeholder="Speaker, volunteer, guest…">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="event" data-for="event">
        <button type="button" class="t-head" id="th-event" aria-expanded="false" aria-controls="tb-event">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Where is this tag going?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-event" role="region" aria-labelledby="th-event">
          <div class="t-inner">
            <label class="sr-only" for="f-event">Event</label>
            <input id="f-event" class="t-input" data-key="event" autocomplete="off" maxlength="24" placeholder="Event name">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="greet" data-for="greet">
        <button type="button" class="t-head" id="th-greet" aria-expanded="false" aria-controls="tb-greet">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">How do you say hi?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-greet" role="region" aria-labelledby="th-greet">
          <div class="t-inner">
            <div class="greets" id="greets" role="radiogroup" aria-label="Greeting"></div>
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="shape" data-for="shape">
        <button type="button" class="t-head" id="th-shape" aria-expanded="false" aria-controls="tb-shape">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Square-ish or round?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-shape" role="region" aria-labelledby="th-shape">
          <div class="t-inner">
            <div class="greets" id="shapes" role="radiogroup" aria-label="Sticker shape">
              <button type="button" class="greet opt" role="radio" aria-checked="true" data-k="shape" data-v="rect"><i class="shape-ic rect" aria-hidden="true"></i>Rectangle</button>
              <button type="button" class="greet opt" role="radio" aria-checked="false" data-k="shape" data-v="circle"><i class="shape-ic circle" aria-hidden="true"></i>Circle</button>
            </div>
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="statement" data-for="statement">
        <button type="button" class="t-head" id="th-statement" aria-expanded="false" aria-controls="tb-statement">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">What's your one-liner?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-statement" role="region" aria-labelledby="th-statement">
          <div class="t-inner">
            <label class="sr-only" for="f-statement">Your one-liner</label>
            <input id="f-statement" class="t-input" data-key="statement" autocomplete="off" maxlength="40" placeholder="you belong here">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="critter" data-for="critter">
        <button type="button" class="t-head" id="th-critter" aria-expanded="false" aria-controls="tb-critter">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Who's your little buddy?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-critter" role="region" aria-labelledby="th-critter">
          <div class="t-inner">
            <div class="greets" role="radiogroup" aria-label="Buddy">
              <button type="button" class="greet opt" role="radio" aria-checked="false" data-k="critter" data-v="fish">Fish</button>
              <button type="button" class="greet opt" role="radio" aria-checked="false" data-k="critter" data-v="narwhal">Narwhal</button>
              <button type="button" class="greet opt" role="radio" aria-checked="false" data-k="critter" data-v="puffer">Puffer</button>
            </div>
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="font" data-for="font">
        <button type="button" class="t-head" id="th-font" aria-expanded="false" aria-controls="tb-font">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Tell me your least favourite font</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-font" role="region" aria-labelledby="th-font">
          <div class="t-inner">
            <label class="sr-only" for="f-font">Your least favourite font</label>
            <input id="f-font" class="t-input" data-key="font" autocomplete="off" maxlength="26" placeholder="Be honest">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="photo" data-for="photo">
        <button type="button" class="t-head" id="th-photo" aria-expanded="false" aria-controls="tb-photo">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Got a good photo?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-photo" role="region" aria-labelledby="th-photo">
          <div class="t-inner">
            <div class="photo-row">
              <label class="photo-tile" for="f-photo" id="photoTile"><span class="sr-only">Choose a photo</span></label>
              <input id="f-photo" type="file" accept="image/*" class="sr-only">
              <div class="photo-copy">
                <label class="link" for="f-photo">Choose a photo</label>
                <button type="button" class="link muted" id="clearPhoto" hidden>Remove it</button>
                <span class="fine">Turned black and white, like a photo booth. It stays on your device.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="stickers" data-for="stickers">
        <button type="button" class="t-head" id="th-stickers" aria-expanded="false" aria-controls="tb-stickers">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Stick some stickers on it</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-stickers" role="region" aria-labelledby="th-stickers">
          <div class="t-inner">
            <div class="greets" id="stickerOpts" role="group" aria-label="Stickers"></div>
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="mood" data-for="mood">
        <button type="button" class="t-head" id="th-mood" aria-expanded="false" aria-controls="tb-mood">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">How's your energy today?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-mood" role="region" aria-labelledby="th-mood">
          <div class="t-inner">
            <label class="sr-only" for="f-mood">Energy</label>
            <input id="f-mood" class="range" type="range" min="0" max="100" data-key="mood" data-num>
            <div class="range-ends" aria-hidden="true"><span>sleepy</span><span>radiant</span></div>
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="back" data-for="back">
        <button type="button" class="t-head" id="th-back" aria-expanded="false" aria-controls="tb-back">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">Anything for the back?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-back" role="region" aria-labelledby="th-back">
          <div class="t-inner">
            <label class="sr-only" for="f-back">Back of the tag</label>
            <input id="f-back" class="t-input" data-key="back" autocomplete="off" maxlength="40" placeholder="how can i help?">
          </div>
        </div>
      </div>
      <div class="ticket" data-ticket="color">
        <button type="button" class="t-head" id="th-color" aria-expanded="false" aria-controls="tb-color">
          <span class="t-no"></span>
          <span class="t-main"><span class="t-q">What's your color?</span></span>
          <span class="t-plus" aria-hidden="true"></span>
        </button>
        <div class="t-body" id="tb-color" role="region" aria-labelledby="th-color">
          <div class="t-inner">
            <div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div>
          </div>
        </div>
      </div>
    </div>

  </aside>
</main>

<dialog class="dlg" id="saveDlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle">Your name tag</h2>
  <div class="dlg-img"><img id="saveImg" alt="Your name tag as an image"></div>
  <p>Right-click or long-press the picture to save it.</p>
  <div class="dlg-actions">
    <button type="button" class="txt" id="dlgClose">Close</button>
    <button type="button" class="solid" id="dlgShare" hidden>Save to phone</button>
    <a class="solid" id="dlgDownload" download="name-tag.png" href="#">Download PNG</a>
  </div>
</dialog>

  <div class="share">
    <button type="button" class="act share-btn" id="shareBtn" aria-haspopup="true" aria-expanded="false" aria-controls="sharePop">
      <span class="act-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>
      <span class="act-t">Share</span>
      <span class="act-s">Email, link or picture</span>
    </button>
    <div class="share-pop" id="sharePop" hidden>
      <a class="share-item" id="shareMail" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
        <span><b>Email it</b><small>Opens your mail app with a link</small></span>
      </a>
      <button type="button" class="share-item" id="shareCopy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span><b>Copy link</b><small>Friends open your exact tag</small></span>
      </button>
      <button type="button" class="share-item" id="sharePic">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
        <span><b>Send the picture</b><small>WhatsApp, Messages, Mail…</small></span>
      </button>
    </div>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
