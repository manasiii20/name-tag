<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hello, i'm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Make a name tag, swing it around, save it as a PNG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Archivo+Narrow:wght@600;700&family=Gaegu:wght@400;700&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <section class="stage" id="stage" aria-label="Your name tag">
    <header class="brand">
      <span class="brand-name">hello, i'm</span>
      <span class="brand-sub">A small name tag maker</span>
    </header>

    <svg class="doodle d1" viewBox="0 0 160 200" aria-hidden="true"><path pathLength="1" d="M80 178 C 40 140, 6 104, 14 62 C 22 22, 70 20, 80 64 C 90 20, 140 22, 146 62 C 152 104, 118 140, 80 178 C 60 196, 34 192, 22 176"/></svg>
    <svg class="doodle d2" viewBox="0 0 160 200" aria-hidden="true"><path pathLength="1" d="M80 178 C 40 140, 6 104, 14 62 C 22 22, 70 20, 80 64 C 90 20, 140 22, 146 62 C 152 104, 118 140, 80 178 C 60 196, 34 192, 22 176"/></svg>

    <div class="mount" id="mount">
      <div class="drop" id="drop">
        <div class="rig" id="rig">
          <div class="strap" id="strap"><span id="strapText"></span></div>
          <div class="clip" aria-hidden="true"><span class="clip-body"></span><span class="clip-stem"></span><span class="clip-ring"></span></div>
          <div class="card" id="card" tabindex="0" role="button">
            <div class="flip">
              <div class="face front" id="front"></div>
              <div class="face back" id="back"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="caption"><span id="specName">Event badge</span><span class="caption-sep" aria-hidden="true"></span><span id="specSize">54 × 86 mm</span></p>
    <p class="hint" id="hint"></p>
  </section>

  <div class="panel-wrap">
    <aside class="panel">
      <div class="panel-head">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.6V5.5a2 2 0 0 1 2-2h6.1l8.9 8.9a2 2 0 0 1 0 2.8l-5.3 5.3a2 2 0 0 1-2.8 0z"/><circle cx="8" cy="8" r="1.4"/></svg>
        <h1>Name tag</h1>
        <button type="button" class="ghost" id="surprise">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle class="dot" cx="9" cy="9" r="1.2"/><circle class="dot" cx="15" cy="15" r="1.2"/><circle class="dot" cx="15" cy="9" r="1.2"/><circle class="dot" cx="9" cy="15" r="1.2"/></svg>Surprise me
        </button>
      </div>

      <div class="panel-body">
        <section class="sec" aria-labelledby="h-style">
          <h2 class="sec-h" id="h-style">Style</h2>
          <div class="chips styles" id="styles">
            <button type="button" class="chip sty" data-tpl="classic">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 9.5h17M7.5 14.5h6"/></svg>Classic
            </button>
            <button type="button" class="chip sty" data-tpl="chatty">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4.5h13a2.5 2.5 0 0 1 2.5 2.5v7.5a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 3.5V17H5.5A2.5 2.5 0 0 1 3 14.5V7a2.5 2.5 0 0 1 2.5-2.5z"/></svg>Chatty
            </button>
            <button type="button" class="chip sty" data-tpl="member">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.3 1.7-2 3-2s2.4.7 3 2M14.5 10h3.5M14.5 13.5h3.5"/></svg>Member
            </button>
            <button type="button" class="chip sty" data-tpl="volunteer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2.5h4V7h-4z"/><rect x="5" y="7" width="14" height="14.5" rx="3"/><path d="M9 13h6M10 17h4"/></svg>Lanyard
            </button>
            <button type="button" class="chip sty" data-tpl="glow">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Glow
            </button>
          </div>
        </section>

        <section class="sec" aria-labelledby="h-details">
          <h2 class="sec-h" id="h-details">Details</h2>
          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" class="name-input" data-key="name" maxlength="24" autocomplete="off" spellcheck="false" autocapitalize="words" placeholder="Your name">
          </div>
          <div class="row">
            <div class="field">
              <label for="f-pronouns">Pronouns</label>
              <input id="f-pronouns" data-key="pronouns" maxlength="16" placeholder="Optional" autocomplete="off">
            </div>
            <div class="field" data-for="role">
              <label for="f-role">Role or team</label>
              <input id="f-role" data-key="role" maxlength="20" autocomplete="off">
            </div>
          </div>
          <div class="row">
            <div class="field" data-for="event">
              <label for="f-event">Event</label>
              <input id="f-event" data-key="event" maxlength="24" autocomplete="off">
            </div>
            <div class="field" data-for="since">
              <label for="f-since">Member since</label>
              <input id="f-since" data-key="since" maxlength="12" autocomplete="off">
            </div>
          </div>
        </section>

        <section class="sec" data-for="greet" aria-labelledby="h-greet">
          <h2 class="sec-h" id="h-greet">Greeting</h2>
          <div class="chips" id="greets" role="radiogroup" aria-labelledby="h-greet"></div>
        </section>

        <section class="sec" data-for="q" aria-labelledby="h-q">
          <h2 class="sec-h" id="h-q">Icebreaker</h2>
          <button type="button" class="question" id="question">
            <span class="question-text" id="questionText"></span>
            <span class="question-action">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.4-4.6M4 13a8 8 0 0 0 14.4 4.6M5 3v4h4M19 21v-4h-4"/></svg>Another
            </span>
          </button>
          <div class="field">
            <label for="f-answer">Your answer</label>
            <input id="f-answer" data-key="answer" maxlength="22" autocomplete="off">
          </div>
        </section>

        <section class="sec" data-for="photo" aria-labelledby="h-photo">
          <h2 class="sec-h" id="h-photo">Photo</h2>
          <div class="photo-row">
            <label class="photo-tile" for="f-photo" id="photoTile">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </label>
            <input id="f-photo" type="file" accept="image/*" class="sr-only">
            <div class="photo-copy">
              <span>Add a photo for the card. It stays on your device.</span>
              <button type="button" class="link" id="clearPhoto" hidden>Remove photo</button>
            </div>
          </div>
        </section>

        <section class="sec" data-for="mood" aria-labelledby="h-mood">
          <h2 class="sec-h" id="h-mood">Energy <output id="moodOut" for="f-mood"></output></h2>
          <input id="f-mood" class="range" type="range" min="0" max="100" data-key="mood" data-num aria-labelledby="h-mood">
        </section>

        <section class="sec" data-for="back" aria-labelledby="h-back">
          <h2 class="sec-h" id="h-back">Flip side</h2>
          <div class="field">
            <label for="f-back" class="sr-only">The flip side says</label>
            <input id="f-back" data-key="back" maxlength="40" autocomplete="off">
          </div>
        </section>

        <section class="sec" aria-labelledby="h-color">
          <h2 class="sec-h" id="h-color">Color <span class="sec-note" id="colorName"></span></h2>
          <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="h-color"></div>
        </section>
      </div>

      <div class="panel-foot">
        <button type="button" class="btn" id="flipBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6M18 3v4h-4M6 21v-4h4"/></svg>Flip
        </button>
        <button type="button" class="btn primary" id="saveBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Save as PNG</span>
        </button>
      </div>
    </aside>
  </div>
</main>

<dialog class="dlg" id="saveDlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.6V5.5a2 2 0 0 1 2-2h6.1l8.9 8.9a2 2 0 0 1 0 2.8l-5.3 5.3a2 2 0 0 1-2.8 0z"/><circle cx="8" cy="8" r="1.4"/></svg>
    <h2 id="dlgTitle">Your name tag</h2>
  </div>
  <div class="dlg-img"><img id="saveImg" alt="Your name tag as an image"></div>
  <p>Right-click or long-press the picture to save it, or use the button.</p>
  <div class="dlg-actions">
    <button type="button" class="btn" id="dlgClose">Keep editing</button>
    <a class="btn primary" id="dlgDownload" download="name-tag.png" href="#">Download PNG</a>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
