<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hello, i'm</title>
<meta name="description" content="Make a name tag, swing it around, save it as a PNG.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Archivo+Narrow:wght@600;700&family=Gaegu:wght@400;700&family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <header class="top">
    <h1 class="site">hello, i'm</h1>
    <div class="top-actions">
      <button type="button" class="txt" id="surprise">Surprise me</button>
      <button type="button" class="txt" id="flipBtn" aria-pressed="false">Flip</button>
      <button type="button" class="solid" id="saveBtn"><span>Save PNG</span></button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Your name tag">
    <svg class="doodle d1" viewBox="0 0 160 200" aria-hidden="true"><path pathLength="1" d="M80 178 C 40 140, 6 104, 14 62 C 22 22, 70 20, 80 64 C 90 20, 140 22, 146 62 C 152 104, 118 140, 80 178 C 60 196, 34 192, 22 176"/></svg>
    <svg class="doodle d2" viewBox="0 0 160 200" aria-hidden="true"><path pathLength="1" d="M80 178 C 40 140, 6 104, 14 62 C 22 22, 70 20, 80 64 C 90 20, 140 22, 146 62 C 152 104, 118 140, 80 178 C 60 196, 34 192, 22 176"/></svg>

    <div class="mount" id="mount">
      <div class="drop" id="drop">
        <div class="rig" id="rig">
          <div class="strap" id="strap"><span id="strapText"></span></div>
          <div class="clip" aria-hidden="true"><span class="clip-body"></span><span class="clip-stem"></span><span class="clip-ring"></span></div>
          <div class="card" id="card" tabindex="0" role="button">
            <div class="flip">
              <div class="face front" id="front"></div>
              <div class="face back" id="back"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="hint" id="hint"></p>
  </section>

  <aside class="form" aria-label="Edit your tag">
    <div class="f-row f-name">
      <label for="f-name">Name</label>
      <input id="f-name" data-key="name" maxlength="24" autocomplete="off" spellcheck="false" autocapitalize="words" placeholder="Your name">
    </div>
    <div class="f-row">
      <label for="f-pronouns">Pronouns</label>
      <input id="f-pronouns" data-key="pronouns" maxlength="16" placeholder="Optional" autocomplete="off">
    </div>
    <div class="f-row" data-for="role">
      <label for="f-role">Role</label>
      <input id="f-role" data-key="role" maxlength="20" autocomplete="off">
    </div>
    <div class="f-row" data-for="event">
      <label for="f-event">Event</label>
      <input id="f-event" data-key="event" maxlength="24" autocomplete="off">
    </div>
    <div class="f-row" data-for="since">
      <label for="f-since">Since</label>
      <input id="f-since" data-key="since" maxlength="12" autocomplete="off">
    </div>
    <div class="f-row" data-for="greet">
      <label for="f-greet">Greeting</label>
      <select id="f-greet" data-key="greet" data-num></select>
    </div>
    <div class="f-row f-tall" data-for="q">
      <span class="label">Question</span>
      <div class="f-stack">
        <p class="q-text" id="questionText"></p>
        <button type="button" class="txt small" id="shuffleQ">Another question</button>
      </div>
    </div>
    <div class="f-row" data-for="answer">
      <label for="f-answer">Answer</label>
      <input id="f-answer" data-key="answer" maxlength="22" autocomplete="off">
    </div>
    <div class="f-row" data-for="photo">
      <span class="label">Photo</span>
      <div class="f-inline">
        <label class="photo-tile" for="f-photo" id="photoTile"><span class="sr-only">Choose a photo</span></label>
        <input id="f-photo" type="file" accept="image/*" class="sr-only">
        <label class="txt small" for="f-photo">Choose</label>
        <button type="button" class="txt small muted" id="clearPhoto" hidden>Remove</button>
      </div>
    </div>
    <div class="f-row" data-for="mood">
      <label for="f-mood">Energy</label>
      <div class="f-inline">
        <input id="f-mood" class="range" type="range" min="0" max="100" data-key="mood" data-num>
        <output id="moodOut" for="f-mood"></output>
      </div>
    </div>
    <div class="f-row" data-for="back">
      <label for="f-back">Back</label>
      <input id="f-back" data-key="back" maxlength="40" autocomplete="off">
    </div>
    <div class="f-row">
      <span class="label" id="l-color">Color</span>
      <div class="f-inline">
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="l-color"></div>
        <span class="muted-txt" id="colorName"></span>
      </div>
    </div>
  </aside>

  <nav class="presets" id="styles" aria-label="Styles">
    <button type="button" class="sty preset" data-tpl="classic"><span class="p-no">01</span><span class="thumb"></span><span class="p-name">Classic</span></button>
    <button type="button" class="sty preset" data-tpl="chatty"><span class="p-no">02</span><span class="thumb"></span><span class="p-name">Chatty</span></button>
    <button type="button" class="sty preset" data-tpl="member"><span class="p-no">03</span><span class="thumb"></span><span class="p-name">Member</span></button>
    <button type="button" class="sty preset" data-tpl="volunteer"><span class="p-no">04</span><span class="thumb"></span><span class="p-name">Lanyard</span></button>
    <button type="button" class="sty preset" data-tpl="glow"><span class="p-no">05</span><span class="thumb"></span><span class="p-name">Glow</span></button>
  </nav>
</main>

<dialog class="dlg" id="saveDlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle">Your name tag</h2>
  <div class="dlg-img"><img id="saveImg" alt="Your name tag as an image"></div>
  <p>Right-click or long-press the picture to save it.</p>
  <div class="dlg-actions">
    <button type="button" class="txt" id="dlgClose">Close</button>
    <a class="solid" id="dlgDownload" download="name-tag.png" href="#">Download PNG</a>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
